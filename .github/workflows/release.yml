# Builds packaged installers per OS and attaches them to a GitHub Release.
# Linux job emits: .deb + .rpm + .AppImage (bundle.targets is "all" in tauri.conf.json).
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`
# ...or run manually from the Actions tab (workflow_dispatch).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev rpm
          # ^ `rpm` CLI is required for the .rpm bundle on Debian runners

      - name: Install frontend dependencies
        run: bun install

      - name: Build + attach installers to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "WhisperMic ${{ github.ref_name }}"
          releaseBody: "Dictation at your cursor. See install guide: apps/website/install.html"
          releaseDraft: true
          prerelease: false
